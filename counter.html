<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter.js | I tuoi contatori</title>
    <link rel="icon" type="image/png" sizes="any" href="./assets/img/logo.png">
    <link rel="stylesheet" href="./assets/css/output.css?v=2">
</head>

<body class="min-h-screen bg-indigo-300 text-gray-900 dark:bg-gray-700 dark:text-white flex flex-col gap-8">
    <nav class="sticky top-0 z-10 flex items-center justify-between gap-4 bg-indigo-300/95 px-6 py-4 dark:bg-gray-700/95">
        <a href="./index.html" class="text-xl font-black tracking-tight">
            COUNTER<span class="text-blue-600 dark:text-blue-400">.js</span>
        </a>
        <button id="darkMode-btn"
            class="rounded-full bg-black px-5 py-3 text-sm font-semibold text-white dark:bg-white dark:text-black">
            Dark mode
        </button>
    </nav>

    <header class="flex flex-col items-center gap-5 px-6 text-center">
        <h1 class="text-4xl font-bold tracking-tight sm:text-6xl">
            I tuoi <span class="text-blue-600 dark:text-blue-400">contatori.</span>
        </h1>
        <p class="max-w-md text-lg text-gray-700 dark:text-gray-300">
            Crea un contatore e tieni traccia di ciò che conta per te.
        </p>
        <button id="insertCounter-btn"
            class="rounded-full bg-blue-400 px-8 py-4 text-base font-semibold text-gray-900 shadow-lg transition duration-200 hover:-translate-y-1 hover:bg-blue-500 dark:bg-blue-800 dark:text-white dark:hover:bg-blue-700">
            + Nuovo contatore
        </button>
    </header>
    <script src="./assets/js/darkMode.js?v=2"></script>
    <script src="./assets/js/counter.js?v=4"></script>
</body>
</html>
